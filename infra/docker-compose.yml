version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: serviapp_db
    environment:
      POSTGRES_USER: serviapp
      POSTGRES_PASSWORD: serviapp123
      POSTGRES_DB: serviapp
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: serviapp_redis
    ports:
      - '6379:6379'

  pgadmin:
    image: dpage/pgadmin4
    container_name: serviapp_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@serviapp.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - '5050:80'

volumes:
  postgres_data: